<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkMesh Firmware Downloads</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
        }

        h1 {
            color: #58a6ff;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 600;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .selector {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d1d9;
            font-weight: 600;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:hover {
            border-color: #58a6ff;
        }

        select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
        }

        .file-list {
            display: none;
        }

        .file-list.visible {
            display: block;
        }

        .file-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .file-item:hover {
            border-color: #58a6ff;
        }

        .file-name {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #c9d1d9;
            font-size: 14px;
        }

        .download-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:hover {
            background: #2ea043;
        }

        .loading {
            text-align: center;
            color: #8b949e;
            padding: 20px;
        }

        .error {
            background: #f85149;
            color: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error.visible {
            display: block;
        }

        .no-files {
            text-align: center;
            color: #8b949e;
            padding: 30px;
            display: none;
        }

        .no-files.visible {
            display: block;
        }

        .info-box {
            background: #1f6feb;
            border: 1px solid #58a6ff;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #c9d1d9;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Torna alla Home</a>

        <header>
            <h1>🌑 DarkMesh Firmware</h1>
            <p class="subtitle">Download firmware builds for your device</p>
        </header>

        <div class="info-box" id="infoBox">
            <strong>ℹ️ Note:</strong> Select your device model first, then choose the firmware version.
        </div>

        <div class="error" id="errorBox"></div>

        <div class="selector">
            <label for="deviceSelect">Device Model</label>
            <select id="deviceSelect">
                <option value="">-- Select Device --</option>
            </select>
        </div>

        <div class="selector">
            <label for="versionSelect">Firmware Version</label>
            <select id="versionSelect" disabled>
                <option value="">Select a device first</option>
            </select>
        </div>

        <div class="download-section">
            <div class="loading" id="loadingMsg">Select a device and version to see available downloads</div>
            <div class="no-files" id="noFilesMsg">No firmware files found for this combination</div>
            <div class="file-list" id="fileList"></div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'TommasoLencioni';
        const REPO_NAME = 'DarkMesh-Firmware';
        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases`;

        let releases = [];
        let currentDevice = null;
        let currentRelease = null;
        let availableDevices = new Set();

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadReleases();
            extractAvailableDevices();
            populateDeviceSelect();
            setupEventListeners();
        });

        async function loadReleases() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch releases');

                releases = await response.json();

                if (releases.length === 0) {
                    showError('No releases found. Please create a release first.');
                    return;
                }
            } catch (error) {
                showError(`Error loading releases: ${error.message}`);
            }
        }

        function extractAvailableDevices() {
            // Scan all releases and extract device names from zip filenames
            releases.forEach(release => {
                release.assets.forEach(asset => {
                    // Match pattern: devicename-version.zip
                    const match = asset.name.match(/^(.+?)-\d+\.\d+\.\d+\..+\.zip$/);
                    if (match) {
                        availableDevices.add(match[1]);
                    }
                });
            });
        }

        function formatDeviceName(deviceKey) {
            // Convert device key to human-readable name
            return deviceKey
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function populateDeviceSelect() {
            const select = document.getElementById('deviceSelect');
            select.innerHTML = '<option value="">-- Select Device --</option>';

            // Sort devices alphabetically
            const sortedDevices = Array.from(availableDevices).sort();

            sortedDevices.forEach(device => {
                const option = document.createElement('option');
                option.value = device;
                option.textContent = formatDeviceName(device);
                select.appendChild(option);
            });

            if (sortedDevices.length === 0) {
                select.innerHTML = '<option value="">No devices found</option>';
                select.disabled = true;
            }
        }

        function setupEventListeners() {
            document.getElementById('deviceSelect').addEventListener('change', onDeviceChange);
            document.getElementById('versionSelect').addEventListener('change', onVersionChange);
        }

        function onDeviceChange(e) {
            currentDevice = e.target.value;
            const versionSelect = document.getElementById('versionSelect');

            if (!currentDevice) {
                versionSelect.disabled = true;
                versionSelect.innerHTML = '<option value="">Select a device first</option>';
                hideFiles();
                return;
            }

            populateVersionsForDevice(currentDevice);
            versionSelect.disabled = false;
        }

        function populateVersionsForDevice(device) {
            const select = document.getElementById('versionSelect');
            select.innerHTML = '<option value="">-- Select Version --</option>';

            // Filter releases that have assets for this device
            const releasesWithDevice = releases.filter(release =>
                release.assets.some(asset => asset.name.includes(device))
            );

            if (releasesWithDevice.length === 0) {
                select.innerHTML = '<option value="">No releases available for this device</option>';
                select.disabled = true;
                hideFiles();
                return;
            }

            releasesWithDevice.forEach((release, index) => {
                const option = document.createElement('option');
                option.value = releases.indexOf(release); // Use original index
                option.textContent = release.name || release.tag_name;
                if (release.prerelease) option.textContent += ' (Pre-release)';
                select.appendChild(option);
            });
        }

        function onVersionChange(e) {
            const index = e.target.value;

            if (!index || !currentDevice) {
                hideFiles();
                return;
            }

            currentRelease = releases[index];
            displayFiles(currentDevice);
        }

        function displayFiles(device) {
            const fileList = document.getElementById('fileList');
            const noFilesMsg = document.getElementById('noFilesMsg');
            const loadingMsg = document.getElementById('loadingMsg');

            // Find matching asset
            const assets = currentRelease.assets.filter(asset =>
                asset.name.includes(device)
            );

            loadingMsg.style.display = 'none';

            if (assets.length === 0) {
                fileList.classList.remove('visible');
                noFilesMsg.classList.add('visible');
                return;
            }

            noFilesMsg.classList.remove('visible');
            fileList.innerHTML = '';

            assets.forEach(asset => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';

                const fileName = document.createElement('div');
                fileName.className = 'file-name';
                fileName.textContent = asset.name;

                const downloadLink = document.createElement('a');
                downloadLink.href = asset.browser_download_url;
                downloadLink.className = 'download-btn';
                downloadLink.textContent = 'Download';
                downloadLink.download = asset.name;

                fileItem.appendChild(fileName);
                fileItem.appendChild(downloadLink);
                fileList.appendChild(fileItem);
            });

            fileList.classList.add('visible');
        }

        function hideFiles() {
            document.getElementById('fileList').classList.remove('visible');
            document.getElementById('noFilesMsg').classList.remove('visible');
            document.getElementById('loadingMsg').style.display = 'block';
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('visible');
        }
    </script>
</body>
</html>
