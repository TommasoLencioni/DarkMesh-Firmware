name: Build DarkMesh Firmware

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build'
        required: true
        type: choice
        options:
          - heltec-v3
        default: heltec-v3
  push:
    branches:
      - '2.5.20-darkmesh_ghost'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Uncomment build epoch
        run: |
          sed -i 's/#-DBUILD_EPOCH=$UNIX_TIME/-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini

      - name: Install dependencies
        run: |
          sudo apt-get -y update --fix-missing
          sudo apt-get install -y cppcheck libbluetooth-dev libgpiod-dev libyaml-cpp-dev lsb-release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: |
            .github/actions/**
            **.ini

      - name: Upgrade python tools
        run: |
          python -m pip install --upgrade pip
          pip install -U --no-build-isolation --no-cache-dir "setuptools<72"
          pip install -U platformio adafruit-nrfutil --no-build-isolation
          pip install -U poetry --no-build-isolation
          pip install -U meshtastic --pre --no-build-isolation

      - name: Upgrade platformio
        run: pio upgrade

      - name: Remove debug flags for release
        run: sed -i '/DDEBUG_HEAP/d' ./arch/esp32/esp32s3.ini

      - name: PlatformIO esp32s3 download cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-esp32s3-${{ hashFiles('.github/actions/**', '**.ini') }}

      - name: Build ${{ inputs.board }}
        run: bin/build-esp32.sh ${{ inputs.board }}

      - name: Get release version string
        run: echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
        id: version

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ inputs.board }}-${{ steps.version.outputs.long }}.zip
          overwrite: true
          path: |
            release/*.bin
            release/*.elf
