name: Release DarkMesh Firmware

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: heltec-v3
            arch: esp32s3
            script: bin/build-esp32.sh
            remove-debug: ./arch/esp32/esp32s3.ini
            pattern: release/*.bin
          - board: heltec-wsl-v3
            arch: esp32s3
            script: bin/build-esp32.sh
            remove-debug: ./arch/esp32/esp32s3.ini
            pattern: release/*.bin
          - board: rak4631
            arch: nrf52840
            script: bin/build-nrf52.sh
            remove-debug: ./arch/nrf52/nrf52.ini
            pattern: release/*.uf2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Uncomment build epoch
        run: sed -i 's/#-DBUILD_EPOCH=$UNIX_TIME/-DBUILD_EPOCH=$UNIX_TIME/' platformio.ini

      - name: Install dependencies
        run: |
          sudo apt-get -y update --fix-missing
          sudo apt-get install -y cppcheck libbluetooth-dev libgpiod-dev libyaml-cpp-dev lsb-release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: |
            .github/actions/**
            **.ini

      - name: Upgrade python tools
        run: |
          python -m pip install --upgrade pip
          pip install -U --no-build-isolation --no-cache-dir "setuptools<72"
          pip install -U platformio adafruit-nrfutil --no-build-isolation
          pip install -U poetry --no-build-isolation
          pip install -U meshtastic --pre --no-build-isolation

      - name: Upgrade platformio
        run: pio upgrade

      - name: Remove debug flags
        run: sed -i '/DDEBUG_HEAP/d' ${{ matrix.remove-debug }}

      - name: PlatformIO cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ matrix.arch }}-${{ hashFiles('.github/actions/**', '**.ini') }}

      - name: Build ${{ matrix.board }}
        run: ${{ matrix.script }} ${{ matrix.board }}

      - name: Get version
        id: version
        run: echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-${{ steps.version.outputs.long }}
          path: ${{ matrix.pattern }}
          retention-days: 1

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Get version
        id: version
        run: |
          VERSION=$(./bin/buildinfo.py long)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "name=DarkMesh Firmware ${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifacts
        run: ls -R ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/**/*.bin
            ./artifacts/**/*.uf2
